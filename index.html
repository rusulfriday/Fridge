<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الثلاجة التفاعلية</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
/* MindAR adds its camera video to the body. Keep it below the transparent WebGL canvas. */
video{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;object-fit:cover!important;z-index:0!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:1!important;background:transparent!important}
.a-canvas{background:transparent!important}
#hint{position:fixed;top:env(safe-area-inset-top,12px);left:6%;width:88%;box-sizing:border-box;z-index:20;text-align:center;background:#fffdf0ed;padding:12px;border-radius:14px;color:#263d5b}
#hint.hidden{display:none}
#overlay{display:none;position:fixed;inset:0;z-index:15;pointer-events:none;align-items:center;justify-content:center}
#overlay.show{display:flex}
#overlay img{display:block;max-width:94vw;max-height:86dvh;object-fit:contain}
#status{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;text-align:center;color:#fff;text-shadow:0 1px 4px #000;z-index:21;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="hint">وجّه الكاميرا نحو بوستر الثلاجة 🧊</div>
<div id="overlay"><img src="./information.png" alt="معلومات الثلاجة"></div>
<div id="status"></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01" renderer="alpha: true; colorManagement: true" background="color: #000; transparent: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity mindar-image-target="targetIndex: 0" id="target"></a-entity>
</a-scene>
<script>
const target=document.querySelector('#target');
const hint=document.querySelector('#hint');
const overlay=document.querySelector('#overlay');
const status=document.querySelector('#status');
const scene=document.querySelector('a-scene');
function placeVideo(){
  const v=document.querySelector('video');
  if(!v)return;
  v.style.setProperty('display','block','important');
  v.style.setProperty('visibility','visible','important');
  v.style.setProperty('opacity','1','important');
  v.style.setProperty('z-index','0','important');
  const canvas=scene.querySelector('canvas');
  if(canvas){canvas.style.setProperty('background','transparent','important');}
}
scene.addEventListener('arReady',placeVideo);
scene.addEventListener('loaded',placeVideo);
new MutationObserver(placeVideo).observe(document.body,{childList:true,subtree:false});
target.addEventListener('targetFound',()=>{hint.classList.add('hidden');overlay.classList.add('show');status.textContent='تم التعرف على البوستر';placeVideo();});
target.addEventListener('targetLost',()=>{hint.classList.remove('hidden');overlay.classList.remove('show');status.textContent='';});
</script>
</body>
</html>
