<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الثلاجة التفاعلية</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0;font-family:system-ui}#hint{position:fixed;top:16px;left:10%;width:80%;z-index:10;text-align:center;background:#fffdf0e8;padding:12px;border-radius:14px;color:#263d5b}#hint.hidden{display:none}</style>
</head><body>
<div id="hint">وجّه الكاميرا نحو بوستر الثلاجة 🧊</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-assets><img id="info" src="./information.jpg" crossorigin="anonymous"></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity mindar-image-target="targetIndex: 0" id="target">
<a-plane src="#info" position="0 0 0.01" width="1" height="1.561" material="shader: flat; side: double; transparent: false"></a-plane>
</a-entity></a-scene>
<script>const t=document.querySelector('#target'),h=document.querySelector('#hint');t.addEventListener('targetFound',()=>h.classList.add('hidden'));t.addEventListener('targetLost',()=>h.classList.remove('hidden'));</script>
</body></html>
