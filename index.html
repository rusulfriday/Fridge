<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الثلاجة التفاعلية</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;background:transparent!important;z-index:1}
a-scene canvas{background:transparent!important}
#hint{position:fixed;top:20px;left:8%;width:84%;box-sizing:border-box;z-index:20;text-align:center;background:#fffdf0ed;padding:12px;border-radius:14px;color:#263d5b}
#hint.hidden{display:none}
#fallback{display:none;position:fixed;inset:0;z-index:15;pointer-events:none;align-items:center;justify-content:center;background:transparent}
#fallback.show{display:flex}
#fallback img{display:block;max-width:90vw;max-height:82dvh;width:auto;height:auto;object-fit:contain}
#status{position:fixed;bottom:16px;left:12px;right:12px;text-align:center;color:white;text-shadow:0 1px 4px #000;z-index:21;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="hint">وجّه الكاميرا نحو بوستر الثلاجة 🧊</div>
<div id="fallback"><img src="./information.png" alt="معلومات الثلاجة"></div>
<div id="status"></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="alpha: true; colorManagement: true" background="color: #ffffff; transparent: true">
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity mindar-image-target="targetIndex: 0" id="target"></a-entity>
</a-scene>
<script>
const target=document.querySelector('#target');
const hint=document.querySelector('#hint');
const fallback=document.querySelector('#fallback');
const status=document.querySelector('#status');
target.addEventListener('targetFound',()=>{hint.classList.add('hidden');fallback.classList.add('show');status.textContent='تم التعرف على البوستر';});
target.addEventListener('targetLost',()=>{hint.classList.remove('hidden');fallback.classList.remove('show');status.textContent='';});
</script>
</body>
</html>
