<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الثلاجة التفاعلية</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#000}
#hint{position:fixed;top:15px;left:7%;width:86%;box-sizing:border-box;z-index:20;text-align:center;background:#fffdf0ef;padding:12px;border-radius:12px;color:#263d5b}
#hint.hidden{display:none}
#status{position:fixed;bottom:14px;left:10px;right:10px;z-index:21;color:white;text-align:center;text-shadow:0 1px 5px #000;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="hint">وجّه الكاميرا نحو بوستر الثلاجة 🧊</div>
<div id="status"></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true" color-space="sRGB" renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
<a-plane id="overlay" position="0 0 0.02" width="1" height="1.56" material="shader: flat; side: double; transparent: true; alphaTest: 0.01; depthWrite: false" visible="false"></a-plane>
</a-entity>
</a-scene>
<script>
const hint=document.getElementById('hint');
const status=document.getElementById('status');
const target=document.getElementById('target');
const overlay=document.getElementById('overlay');
let found=false, ready=false;
const image=new Image();
image.onload=()=>{
  ready=true;
  const texture=new THREE.Texture(image);
  texture.needsUpdate=true;
  texture.colorSpace=THREE.SRGBColorSpace || texture.colorSpace;
  const apply=()=>{
    if(!overlay.getObject3D('mesh')){requestAnimationFrame(apply);return;}
    const mesh=overlay.getObject3D('mesh');
    mesh.material.map=texture;
    mesh.material.transparent=true;
    mesh.material.needsUpdate=true;
    overlay.setAttribute('visible',found);
    if(found)status.textContent='';
  };
  apply();
};
image.onerror=()=>{status.textContent='تعذر تحميل information.png';};
image.src='./information.png?v=3';
target.addEventListener('targetFound',()=>{
  found=true;
  hint.classList.add('hidden');
  overlay.setAttribute('visible',ready);
  status.textContent=ready?'':'جار تحميل صورة المعلومات…';
});
target.addEventListener('targetLost',()=>{
  found=false;
  hint.classList.remove('hidden');
  overlay.setAttribute('visible',false);
  status.textContent='';
});
</script>
</body>
</html>
